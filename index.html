<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vagalumes – O Mundo Mágico da Luz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;700&display=swap');

    :root {
      --bg: #0a0f1a;
      --card: #121a2b;
      --accent: #a8e063;
      --accent2: #f9d423;
      --text: #e8f0ff;
      --muted: #9bb0d0;
      --glow: 0 0 20px rgba(168, 224, 99, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(ellipse at center, #1a2740 0%, #0a0f1a 70%);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168,224,99,0.15) 0%, transparent 70%);
      top: 20%;
      left: 10%;
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(249,212,35,0.12) 0%, transparent 70%);
      bottom: 15%;
      right: 15%;
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }

    .hero-img {
      width: 220px;
      max-width: 80%;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 25px rgba(168, 224, 99, 0.6));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(168, 224, 99, 0.5)); }
      50% { filter: drop-shadow(0 0 35px rgba(249, 212, 35, 0.7)); }
    }
